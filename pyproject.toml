[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vlab"
version = "0.1.0"
description = "Valorisation d'une société du TSX (Canadien National) : historique EDGAR, DCF sous hypothèses statuées, DCF inversé, sensibilités, comparables, classeur Excel et mémo bilingue."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guillaume Vaudescal" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "typer>=0.12",
  "requests>=2.32",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vlab = "vlab.cli:app"

[project.urls]
Repository = "https://github.com/Guilou001/09-valorisation-entreprise"

[tool.hatch.build.targets.wheel]
packages = ["src/vlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
